name: Kable Killers Windows - Build

on:
  push:
    branches:
      - kk-windows
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kable-killers-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile Windows app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Nuvio configuration
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE|NUVIO_SUPABASE_URL|NUVIO_SUPABASE_ANON_KEY)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi
          printf '\nNUVIO_SUPABASE_URL=https://api.nuvio.tv\n' >> local.properties
          printf 'NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN\n' >> local.properties
      - name: Compile
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:compileKotlinDesktop \
            -Pnuvio.android.distribution=full \
            --continue --stacktrace

  package:
    name: Build Windows installer
    needs: compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Nuvio configuration
        shell: bash
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE|NUVIO_SUPABASE_URL|NUVIO_SUPABASE_ANON_KEY)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi
          printf '\nNUVIO_SUPABASE_URL=https://api.nuvio.tv\n' >> local.properties
          printf 'NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN\n' >> local.properties
      - name: Download libmpv (video player)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p mpv-download composeApp/desktop-resources/windows
          gh release download -R shinchiro/mpv-winbuild-cmake --pattern 'mpv-dev-x86_64-2*.7z' -D mpv-download
          ls -la mpv-download
          7z e mpv-download/*.7z libmpv-2.dll -ocomposeApp/desktop-resources/windows -y
          ls -la composeApp/desktop-resources/windows
          test -s composeApp/desktop-resources/windows/libmpv-2.dll
      - name: Build installer
        shell: bash
        run: |
          ./gradlew :composeApp:packageMsi :composeApp:packageExe \
            -Pnuvio.android.distribution=full \
            --stacktrace
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Kable-Killers-Windows
          path: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
          retention-days: 30
