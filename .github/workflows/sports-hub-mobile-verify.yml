name: Sports Hub Mobile device-test APK

on:
  pull_request:
    paths:
      - 'composeApp/src/commonMain/kotlin/com/nuvio/app/features/sports/**'
      - 'composeApp/src/commonTest/kotlin/com/nuvio/app/features/sports/**'
      - '.github/workflows/sports-hub-mobile-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Discover supported Compose Android test tasks
        run: ./gradlew :composeApp:tasks --all --no-daemon | tee compose-gradle-tasks.txt
      - name: Run supported Android tests and build installable debug APK
        run: |
          set -euo pipefail
          TASK=$(grep -E '^([[:alnum:]_]*HostTest|[[:alnum:]_]*UnitTest)[[:space:]]+-' compose-gradle-tasks.txt | grep -E 'Android|android|Debug|debug' | head -n 1 | awk '{print $1}' || true)
          if [ -z "$TASK" ]; then
            echo "::error::No Android host test task found. See Compose task listing above."
            exit 1
          fi
          echo "Using Compose test task: $TASK"
          ./gradlew ":composeApp:$TASK" :androidApp:assembleFullDebug --stacktrace --no-daemon
      - name: Upload device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: kable-killers-mobile-sports-hub-debug
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
