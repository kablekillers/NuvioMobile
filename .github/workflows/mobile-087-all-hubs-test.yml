name: Kable Killers Mobile 0.9.0 Sports Hub Debug Test

on:
  push:
    branches:
      - feature/mobile-087-all-hubs-device-test
  pull_request:
    paths:
      - 'composeApp/src/commonMain/kotlin/com/nuvio/app/features/sports/**'
      - 'composeApp/src/commonTest/kotlin/com/nuvio/app/features/sports/**'
      - '.github/workflows/mobile-087-integrated-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - name: Create local Android SDK properties
        run: |
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          printf 'NUVIO_SUPABASE_URL=https://api.nuvio.tv\n' >> local.properties
          printf 'NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN\n' >> local.properties
      - name: Build integrated full debug APK
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-090-sports-hub-debug-test
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
