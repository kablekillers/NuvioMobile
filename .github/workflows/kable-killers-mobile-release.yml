name: Kable Killers Mobile - Release

# How to release:
#   1. Bump MARKETING_VERSION and CURRENT_PROJECT_VERSION in iosApp/Configuration/Version.xcconfig.
#   2. Merge to cmp-rewrite.
#   3. Push a tag that matches the version:  git tag v0.5.21 && git push origin v0.5.21
# The workflow builds signed APKs and publishes the GitHub release the Android in-app updater
# reads as soon as they're ready. The unsigned iPhone IPA (about 2 hours) is then added to the
# same release and to the SideStore/AltStore source (branch altstore-source, file source.json).
#
# To test a release build without publishing, run this workflow manually ("Run workflow")
# and leave "publish" unchecked; the APKs are attached to the run as an artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release (otherwise build only)
        type: boolean
        default: false
      minify:
        description: Shrink code and resources with R8 (recommended)
        type: boolean
        default: true
      ios:
        description: Also build the iPhone IPA
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: kable-killers-mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APKs
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          config=iosApp/Configuration/Version.xcconfig
          name="$(sed -n 's/^MARKETING_VERSION=//p' "$config" | tr -d '[:space:]')"
          code="$(sed -n 's/^CURRENT_PROJECT_VERSION=//p' "$config" | tr -d '[:space:]')"
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::Version.xcconfig is missing MARKETING_VERSION or CURRENT_PROJECT_VERSION"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${name}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Version.xcconfig (v${name}). Bump the version or fix the tag."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] || [ "${{ inputs.publish }}" = true ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.minify }}" = false ]; then
            echo "minify=false" >> "$GITHUB_OUTPUT"
          else
            echo "minify=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Building Kable Killers Mobile v$name ($code)"

      - name: Refuse to overwrite an existing release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version in Version.xcconfig."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing and app configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KABLE_KILLERS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KABLE_KILLERS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KABLE_KILLERS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KABLE_KILLERS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing signing secret: $variable"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > kable-killers-mobile.jks
          {
            echo "NUVIO_RELEASE_STORE_FILE=kable-killers-mobile.jks"
            echo "NUVIO_SUPABASE_URL=https://api.nuvio.tv"
            echo "NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN"
            printf 'NUVIO_RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'NUVIO_RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'NUVIO_RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > local.properties

      - name: Build signed release APKs
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullRelease \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            -PreleaseMinifyEnabled=${{ steps.version.outputs.minify }} \
            --stacktrace

      - name: Remove temporary signing files
        if: always()
        run: rm -f kable-killers-mobile.jks local.properties

      - name: Collect APKs
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          out=androidApp/build/outputs/apk/full/release
          mkdir -p dist
          # Per-ABI APKs are much smaller; the in-app updater picks the one that matches the phone.
          # x86 is left out on purpose: its name is a prefix of x86_64, and those rare devices
          # fall back to the universal APK.
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            src="$out/androidApp-full-$abi-release.apk"
            if [ ! -f "$src" ]; then
              echo "::error::Missing $src"
              ls -lah "$out" || true
              exit 1
            fi
            cp "$src" "dist/Kable-Killers-Mobile-v${VERSION}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lah dist
          {
            echo "### Kable Killers Mobile v${VERSION}"
            echo '| APK | Size |'
            echo '|---|---|'
            for f in dist/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: Kable-Killers-Mobile-v${{ steps.version.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iPhone
    if: github.ref_type == 'tag' || inputs.ios != false
    uses: ./.github/workflows/kable-killers-ios.yml

  publish:
    name: Publish release (Android)
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.name }}
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: Kable-Killers-Mobile-v${{ needs.release.outputs.name }}
          path: dist

      # Published as soon as Android is ready, so the in-app updater picks it up right away.
      # The iPhone IPA is added to the same release later by publish-ios.
      - name: Publish GitHub release
        run: |
          set -euo pipefail
          ls -lah dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kable Killers Mobile v${VERSION}" \
            --generate-notes \
            --latest

  publish-ios:
    name: Add iPhone IPA to release
    needs: [release, ios, publish]
    if: needs.publish.result == 'success' && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.name }}
      BUILD: ${{ needs.release.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download iPhone IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ios.outputs.artifact }}
          path: dist

      - name: Upload IPA to the release
        run: gh release upload "$TAG" dist/*.ipa dist/SHA256SUMS-ios.txt --repo "$GITHUB_REPOSITORY"

      - name: Add the IPA to the SideStore/AltStore source
        run: |
          set -euo pipefail
          ipa="dist/Kable-Killers-Mobile-v${VERSION}.ipa"
          test -f "$ipa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp scripts/kable-killers-altstore-source.py /tmp/altstore-source.py
          if git fetch --depth 1 origin altstore-source 2>/dev/null; then
            git switch -C altstore-source FETCH_HEAD
          else
            git switch --orphan altstore-source
          fi
          python3 -I /tmp/altstore-source.py source.json \
            --version "$VERSION" \
            --build "$BUILD" \
            --ipa "$ipa" \
            --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Kable-Killers-Mobile-v${VERSION}.ipa" \
            --notes "Kable Killers Mobile v${VERSION}. Full notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          git add source.json
          git commit -m "Add Kable Killers Mobile v${VERSION} to the iPhone source"
          git push origin altstore-source
          echo "Source URL: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/altstore-source/source.json" >> "$GITHUB_STEP_SUMMARY"
