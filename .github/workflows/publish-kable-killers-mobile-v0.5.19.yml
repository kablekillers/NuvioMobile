name: Publish Kable Killers Mobile v0.5.19
on:
  push:
    branches: [cmp-rewrite]
    paths:
      - .github/workflows/publish-kable-killers-mobile-v0.5.19.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify signed release run and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=42445260779
          expected_sha=aa6aab485257a5779c691289481aaee547b0dda1
          result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          for attempt in $(seq 1 60); do
            result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<< "$result")"
            if [ "$status" = completed ]; then break; fi
            echo "Waiting for signed build ($attempt/60): $status"
            sleep 30
          done
          test "$(jq -r '.conclusion' <<< "$result")" = success
          test "$(jq -r '.head_sha' <<< "$result")" = "$expected_sha"
          test "$(jq -r '.head_branch' <<< "$result")" = cmp-rewrite
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name Kable-Killers-Mobile-Signed-Release --dir signed
          apk=signed/androidApp-full-universal-release.apk
          test -s "$apk"
          sha256sum "$apk"
          if gh release view v0.5.19 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.5.19 already exists; not overwriting it."
            exit 0
          fi
          gh release create v0.5.19 "$apk" --repo "$GITHUB_REPOSITORY" --target cmp-rewrite \
            --title "Kable Killers Mobile v0.5.19" \
            --notes "Fixes remote QR/manual-code sign-in completion after approval. Validated successfully on a previously failing device in a different household. Signed production build: https://github.com/kablekillers/NuvioMobile/actions/runs/42445260779"
