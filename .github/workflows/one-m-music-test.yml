name: Kable Killers Mobile - One M Music test build

on:
  push:
    branches:
      - feature/one-m-music
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-m-music-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - name: App configuration
        run: |
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          printf 'NUVIO_SUPABASE_URL=https://api.nuvio.tv\n' >> local.properties
          printf 'NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN\n' >> local.properties
      - name: Sports channel tests
        run: ./gradlew :composeApp:testAndroidHostTest --tests 'com.nuvio.app.features.sports.SportsLiveTvTest' --no-daemon
      - name: Build integrated full debug APK
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace --no-daemon "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1536m"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: kk-mobile-music-test-${{ github.run_number }}
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
