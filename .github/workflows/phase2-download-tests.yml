name: Phase 2 Download Queue Unit Tests

on:
  pull_request:
    paths:
      - 'composeApp/src/commonMain/kotlin/com/nuvio/app/features/downloads/**'
      - 'composeApp/src/commonTest/kotlin/com/nuvio/app/features/downloads/**'
      - 'composeApp/src/androidMain/kotlin/com/nuvio/app/features/downloads/**'
      - 'composeApp/src/androidHostTest/kotlin/com/nuvio/app/features/downloads/**'
      - '.github/workflows/phase2-download-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-queue-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare local Gradle configuration
        run: touch local.properties
      - name: Run Phase 2 queue tests
        run: >-
          ./gradlew :composeApp:testAndroidHostTest
          --tests 'com.nuvio.app.features.downloads.DownloadQueueTest'
          --tests 'com.nuvio.app.features.downloads.DownloadQueueSnapshotCodecTest'
          --tests 'com.nuvio.app.features.downloads.DownloadQueueRepositoryTest'
          --tests 'com.nuvio.app.features.downloads.AndroidDownloadQueueProjectionTest'
          --stacktrace --no-daemon
