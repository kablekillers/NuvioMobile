name: Kable Killers Windows - Release

# How to release a Windows version:
#   1. Bump WINDOWS_VERSION in version.conf (MAJOR.MINOR.BUILD, MAJOR >= 1).
#   2. Push the code to the "release-windows" branch.
# This builds the installers and publishes GitHub release "windows-v<version>".
# Windows releases are never marked "latest", so the phone app's updater ignores them;
# the Windows app and the store page look for "windows-v" releases instead.

on:
  push:
    branches:
      - release-windows
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kable-killers-windows-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -E '^WINDOWS_VERSION=' version.conf | cut -d= -f2 | tr -d '[:space:]')
          [[ "$version" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]] || { echo "::error::WINDOWS_VERSION '$version' must look like 1.0.0"; exit 1; }
          if gh release view "windows-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release windows-v$version already exists. Bump WINDOWS_VERSION in version.conf."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare Nuvio configuration
        shell: bash
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE|NUVIO_SUPABASE_URL|NUVIO_SUPABASE_ANON_KEY)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi
          printf '\nNUVIO_SUPABASE_URL=https://api.nuvio.tv\n' >> local.properties
          printf 'NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN\n' >> local.properties

      - name: Download libmpv (video player)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mpv-download composeApp/desktop-resources/windows
          gh release download -R shinchiro/mpv-winbuild-cmake --pattern 'mpv-dev-x86_64-2*.7z' -D mpv-download
          7z e mpv-download/*.7z libmpv-2.dll -ocomposeApp/desktop-resources/windows -y
          test -s composeApp/desktop-resources/windows/libmpv-2.dll

      - name: Build installers
        shell: bash
        run: |
          ./gradlew :composeApp:packageMsi :composeApp:packageExe \
            -Pnuvio.android.distribution=full \
            -PkkWindowsVersion=${{ steps.version.outputs.version }} \
            --stacktrace

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          v=${{ steps.version.outputs.version }}
          mkdir dist
          cp composeApp/build/compose/binaries/main/msi/*.msi "dist/Kable-Killers-Windows-$v.msi"
          cp composeApp/build/compose/binaries/main/exe/*.exe "dist/Kable-Killers-Windows-$v.exe"
          (cd dist && sha256sum * > SHA256SUMS-windows.txt)
          ls -la dist
          gh release create "windows-v$v" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kable Killers Windows $v" \
            --notes "Kable Killers for Windows $v. Download the .exe to install. Windows may show \"Windows protected your PC\" the first time: click More info, then Run anyway." \
            --latest=false
