
name: Kable Killers Mobile - Signed Release

on:
  push:
    branches:
      - cmp-rewrite
      - kable-killers-update-test
    paths:
      - ".github/workflows/kable-killers-mobile-release.yml"
      - "iosApp/Configuration/Version.xcconfig"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing and app configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KABLE_KILLERS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KABLE_KILLERS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KABLE_KILLERS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KABLE_KILLERS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for variable in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing signing secret: $variable"
              exit 1
            fi
          done

          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > kable-killers-mobile.jks

          cat > local.properties <<'EOF'
          NUVIO_RELEASE_STORE_FILE=kable-killers-mobile.jks
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
          EOF

          printf 'NUVIO_RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD" >> local.properties
          printf 'NUVIO_RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> local.properties
          printf 'NUVIO_RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> local.properties

      - name: Build signed universal release APK
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullRelease \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            -PreleaseMinifyEnabled=false \
            --stacktrace

      - name: Verify universal APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK="androidApp/build/outputs/apk/full/release/androidApp-full-universal-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Universal release APK not found"
            ls -lah androidApp/build/outputs/apk/full/release/ || true
            exit 1
          fi

          echo "Universal release APK generated successfully."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Kable-Killers-Mobile-Signed-Release
          path: androidApp/build/outputs/apk/full/release/androidApp-full-universal-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify compatibility with installed 0.5.9 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="androidApp/build/outputs/apk/full/release/androidApp-full-universal-release.apk"
          gh release download v0.5.9 --pattern 'Kable.Killers.Mobile.apk' --dir /tmp/kable-previous
          OLD="/tmp/kable-previous/Kable.Killers.Mobile.apk"
          test -s "$OLD"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          old_badging="$("$AAPT" dump badging "$OLD" | head -1)"
          new_badging="$("$AAPT" dump badging "$APK" | head -1)"
          echo "Previous: $old_badging"
          echo "Candidate: $new_badging"
          old_package="$(echo "$old_badging" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          new_package="$(echo "$new_badging" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          old_code="$(echo "$old_badging" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")"
          new_code="$(echo "$new_badging" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")"
          new_version="$(echo "$new_badging" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")"
          test -n "$old_package" && test "$old_package" = "$new_package"
          test "$new_package" = "com.kablekillers.mobile"
          test -n "$old_code" && test -n "$new_code"
          test "$new_code" -gt "$old_code"
          test "$new_version" = "0.5.10"
          echo "Verifying previous APK signature..."
          "$APKSIGNER" verify --verbose "$OLD" || { echo "::error::Previous APK signature verification failed"; exit 1; }
          echo "Verifying candidate APK signature..."
          "$APKSIGNER" verify --verbose "$APK" || { echo "::error::Candidate APK signature verification failed"; exit 1; }
          old_certs="$("$APKSIGNER" verify --print-certs "$OLD")"
          new_certs="$("$APKSIGNER" verify --print-certs "$APK")"
          old_cert="$(printf '%s\\n' "$old_certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          new_cert="$(printf '%s\\n' "$new_certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          echo "Previous APK certificate SHA-256: ${old_cert:-unavailable}"
          echo "Candidate APK certificate SHA-256: ${new_cert:-unavailable}"
          if [ -z "$old_cert" ] || [ -z "$new_cert" ]; then
            echo "::error::Could not read both APK signing certificates"
            exit 1
          fi
          if [ "$old_cert" != "$new_cert" ]; then
            echo "::error::APK signing certificates differ. In-place update is not safe."
            exit 1
          fi
          echo "Verified package, increasing version code, and matching signing certificate."

      - name: Publish verified mobile update test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.10 >/dev/null 2>&1; then
            echo "::error::Release v0.5.10 already exists; refusing to overwrite."
            exit 1
          fi
          gh release create v0.5.10 \
            androidApp/build/outputs/apk/full/release/androidApp-full-universal-release.apk#Kable.Killers.Mobile.apk \
            --target "$GITHUB_SHA" \
            --title "Kable Killers Mobile 0.5.10" \
            --notes "Optional update notification test for Kable Killers Mobile. Watch Party features unchanged."

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f kable-killers-mobile.jks local.properties
