name: Phase 2 Download Queue Unit Tests

on:
  pull_request:
    paths:
      - 'composeApp/src/commonMain/kotlin/com/nuvio/app/features/downloads/**'
      - 'composeApp/src/commonTest/kotlin/com/nuvio/app/features/downloads/**'
      - 'composeApp/src/androidMain/kotlin/com/nuvio/app/features/downloads/**'
      - '.github/workflows/phase2-download-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-queue-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Android host unit tests (includes commonTest)
        run: ./gradlew :composeApp:testAndroidHostTest --stacktrace --no-daemon
