name: Kable Killers Mobile compile check
on:
  push:
    branches: [kable-killers-mobile-update]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install required Android API 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "Installed SDK platforms:"
          ls -1 "$ANDROID_SDK_ROOT/platforms"
          if [ ! -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER="$(command -v sdkmanager)"
            fi
            echo "Checking SDK package availability..."
            "$SDKMANAGER" --list --channel=3 | grep -E 'platforms;android-37|build-tools;37' || true
            yes | "$SDKMANAGER" --channel=3 --licenses >/dev/null || true
            "$SDKMANAGER" --channel=3 "platforms;android-37"
          fi
          test -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar" || {
            echo "::error::Android API 37 SDK unavailable. Cannot compile dependencies requiring API 37 against API 36."
            exit 1
          }
          echo "Android API 37 installed. Preserving repository compileSdk configuration."
      - name: Create local build properties
        shell: bash
        run: |
          touch local.properties
          echo "Created local.properties for Gradle task input validation."
      - name: Verify Watch Party Kotlin compilation independently
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew :composeApp:compileAndroidMain --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/kotlin-check.log"
      - name: Compile Android debug APK
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew :androidApp:assembleFullDebug --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/mobile-build.log"
      - name: Print concise build failure report
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/mobile-build.log"
          if [ -f "$LOG" ]; then
            echo "=== FIRST BUILD ERRORS ==="
            grep -n -m 35 -E '(^e: |^error:|^FAILURE:|^\* What went wrong:|^Execution failed|^> Task .* FAILED|Unresolved reference|Compilation error|Could not resolve|Caused by:)' "$LOG" || true
            echo "=== LAST 90 LINES ==="
            tail -n 90 "$LOG"
            {
              echo "## Build failure summary"
              echo '~~~text'
              sed -n '/^\* What went wrong:/,/^\* Try:/p' "$LOG" | head -n 110
              echo '--- AAR metadata requirements ---'
              grep -n -A 7 -B 2 -E 'requires (libraries|dependencies|Android API|compileSdk)|requires.*compile against|compileSdk|AAR metadata|checkFullDebugAarMetadata' "$LOG" | tail -n 100 || true
              echo '--- Compiler errors ---'
              grep -m 35 -E '(^e: |^error:|^FAILURE:|^\* What went wrong:|^Execution failed|^> Task .* FAILED|Unresolved reference|Compilation error|Could not resolve|Caused by:)' "$LOG" || true
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kable-killers-mobile-debug
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
