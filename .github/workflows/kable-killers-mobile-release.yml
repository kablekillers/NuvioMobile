name: Kable Killers Mobile - Release

# How to release:
#   1. Bump MARKETING_VERSION and CURRENT_PROJECT_VERSION in iosApp/Configuration/Version.xcconfig.
#   2. Merge to cmp-rewrite.
#   3. Push a tag that matches the version:  git tag v0.5.21 && git push origin v0.5.21
# The workflow builds signed APKs and publishes the GitHub release the Android in-app updater
# reads as soon as they're ready. The unsigned iPhone IPA (about 2 hours) is then added to the
# same release and to the SideStore/AltStore source (branch altstore-source, file source.json).
#
# To test a release build without publishing, run this workflow manually ("Run workflow")
# and leave "publish" unchecked; the APKs are attached to the run as an artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
    name: Publish release (Android)
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.name }}
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: Kable-Killers-Mobile-v${{ needs.release.outputs.name }}
          path: dist

      # Published as soon as Android is ready, so the in-app updater picks it up right away.
      # The iPhone IPA is added to the same release later by publish-ios.
      - name: Publish GitHub release
        run: |
          set -euo pipefail
          ls -lah dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kable Killers Mobile v${VERSION}" \
            --generate-notes \
            --latest

  publish-ios:
    name: Add iPhone IPA to release
    needs: [release, ios, publish]
    if: needs.publish.result == 'success' && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.name }}
      BUILD: ${{ needs.release.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download iPhone IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ios.outputs.artifact }}
          path: dist

      - name: Upload IPA to the release
        run: gh release upload "$TAG" dist/*.ipa dist/SHA256SUMS-ios.txt --repo "$GITHUB_REPOSITORY"

      - name: Add the IPA to the SideStore/AltStore source
        run: |
          set -euo pipefail
          ipa="dist/Kable-Killers-Mobile-v${VERSION}.ipa"
          test -f "$ipa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp scripts/kable-killers-altstore-source.py /tmp/altstore-source.py
          if git fetch --depth 1 origin altstore-source 2>/dev/null; then
            git switch -C altstore-source FETCH_HEAD
          else
            git switch --orphan altstore-source
          fi
          python3 -I /tmp/altstore-source.py source.json \
            --version "$VERSION" \
            --build "$BUILD" \
            --ipa "$ipa" \
            --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Kable-Killers-Mobile-v${VERSION}.ipa" \
            --notes "Kable Killers Mobile v${VERSION}. Full notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          git add source.json
          git commit -m "Add Kable Killers Mobile v${VERSION} to the iPhone source"
          git push origin altstore-source
          echo "Source URL: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/altstore-source/source.json" >> "$GITHUB_STEP_SUMMARY"
