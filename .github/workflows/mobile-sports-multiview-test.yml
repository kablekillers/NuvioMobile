name: Mobile Sports Multiview - Debug Verification

on:
  push:
    branches:
      - feature/mobile-090-sports-discovery-multiview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-sports-multiview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test mobile sports changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare app configuration
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE|NUVIO_SUPABASE_URL|NUVIO_SUPABASE_ANON_KEY)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi
          printf '\nNUVIO_SUPABASE_URL=https://api.nuvio.tv\n' >> local.properties
          printf 'NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN\n' >> local.properties
      - name: Compile debug APK and common tests
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:testDebugUnitTest :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Kable-Killers-Mobile-Multiview-Test-APK
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          if-no-files-found: error
          retention-days: 14
