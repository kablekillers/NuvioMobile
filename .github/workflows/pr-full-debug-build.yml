name: Kable Killers Mobile - Build APK Test

on:
  push:
    branches:
      - cmp-rewrite
  pull_request:
    branches:
      - cmp-rewrite
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kable-killers-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kable Killers Mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare configuration
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      - name: Build Mobile APK
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullDebug \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            --stacktrace

      - name: Upload Kable Killers Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Kable-Killers-Mobile-Test-APK
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          if-no-files-found: error
          retention-days: 14
