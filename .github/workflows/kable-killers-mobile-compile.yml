name: Kable Killers Mobile compile check
on:
  push:
    branches: [kable-killers-mobile-update]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure SDK for temporary CI compile check
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "Installed SDK platforms:"
          ls -1 "$ANDROID_SDK_ROOT/platforms"
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            echo "Android API 37 is installed; using project defaults."
          else
            echo "::warning::API 37 unavailable on this runner; using API 36 for CI compilation only. Repository compileSdk remains 37."
            test -d "$ANDROID_SDK_ROOT/platforms/android-36"
            python3 - <<'PY'
          from pathlib import Path
          p = Path("androidApp/build.gradle.kts")
          s = p.read_text()
          original = """    compileSdk =
                  libs.versions.android.compileSdk.get().toInt()"""
          assert original in s, "Expected compileSdk declaration not found"
          s = s.replace(original, "    compileSdk = 36", 1)
          p.write_text(s)
          PY
          fi
      - name: Create local build properties
        shell: bash
        run: |
          touch local.properties
          echo "Created local.properties for Gradle task input validation."
      - name: Compile Android debug APK
        run: bash ./gradlew :androidApp:assembleFullDebug --stacktrace --no-daemon
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kable-killers-mobile-debug
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
